<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚛️ Olivaris — Trading Dashboard v10</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #12131a;
    --surface2: #1a1b25;
    --border: #2a2b38;
    --border-card: rgba(168, 85, 247, 0.15);
    --violet-electric: #b44aff;
    --text: #e8eaed;
    --text-muted: #6b7280;
    --text-dim: #4b5563;
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.1);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.1);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.1);
    --purple: #a855f7;
    --purple-bg: rgba(168, 85, 247, 0.1);
    --orange: #f59e0b;
    --orange-bg: rgba(245, 158, 11, 0.1);
    --radius: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    line-height: 1.5;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .header-left h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .header-left h1 span { color: var(--violet-electric); }
  .header-sub { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; font-family: var(--mono); }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; font-family: var(--mono); }
  .badge-paulo { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; margin-right: 4px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .live-label { font-size: 0.7rem; color: var(--green); font-family: var(--mono); }

  .hero {
    background: var(--surface);
    border: 1px solid var(--border-card);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .hero.positive::before { background: linear-gradient(90deg, var(--green), #34d399, var(--green)); }
  .hero.negative::before { background: linear-gradient(90deg, var(--red), #f87171, var(--red)); }
  .hero-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
  .hero-value { font-size: 3.2rem; font-weight: 800; font-family: var(--mono); letter-spacing: -0.03em; }
  .hero-detail { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-family: var(--mono); }
  .hero-sub { display: flex; justify-content: center; gap: 32px; margin-top: 16px; flex-wrap: wrap; }
  .hero-sub-item { text-align: center; }
  .hero-sub-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .hero-sub-value { font-size: 1.1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
  .hero-toggle { margin-top: 12px; }
  .hero-toggle-btn {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted);
    padding: 6px 14px; border-radius: 6px; font-family: var(--mono); font-size: 0.7rem;
    cursor: pointer; transition: all 150ms ease;
  }
  .hero-toggle-btn:hover { border-color: var(--blue); color: var(--blue); }

  .section { margin-bottom: 28px; }
  .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 14px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border-card); border-radius: var(--radius);
    padding: 18px; transition: border-color 200ms ease;
  }
  .summary-card:hover { border-color: rgba(168, 85, 247, 0.35); }
  .summary-card .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
  .summary-card .value { font-size: 1.6rem; font-weight: 800; font-family: var(--mono); letter-spacing: -0.02em; }
  .summary-card .detail { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; font-family: var(--mono); }

  .grid-status-container {
    background: var(--surface); border: 1px solid var(--border-card); border-radius: var(--radius);
    padding: 24px;
  }
  .grid-config-line {
    font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono);
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .grid-health {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    padding: 12px 16px; background: var(--surface2); border-radius: 8px;
  }
  .grid-health-icon { font-size: 1.4rem; }
  .grid-health-text { flex: 1; }
  .grid-health-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .grid-health-status { font-size: 1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
  .grid-coins { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .grid-coin {
    background: var(--surface2); border: 1px solid var(--border-card); border-radius: 10px;
    padding: 16px;
  }
  .grid-coin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .grid-coin-name { font-size: 1rem; font-weight: 700; }
  .grid-coin-count { font-size: 0.72rem; font-family: var(--mono); color: var(--text-muted); }
  .grid-coin-progress {
    width: 100%; height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden; margin-bottom: 8px;
  }
  .grid-coin-progress-bar { height: 100%; transition: width 200ms ease; }
  .grid-coin-inventory { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); }

  .grid-perf-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
    margin-bottom: 18px;
  }
  .grid-perf-stat {
    background: var(--surface2); border: 1px solid var(--border-card); border-radius: 8px;
    padding: 14px;
  }
  .grid-perf-stat .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .grid-perf-stat .value { font-size: 1.3rem; font-weight: 700; font-family: var(--mono); margin-top: 4px; }

  .agent-card {
    background: var(--surface); border: 1px solid var(--border-card); border-radius: var(--radius);
    padding: 20px; position: relative; overflow: hidden;
  }
  .agent-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--blue), #60a5fa); }
  .agent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .agent-name { font-size: 1.1rem; font-weight: 800; color: var(--blue); }
  .agent-role { font-size: 0.68rem; color: var(--text-muted); font-family: var(--mono); }
  .agent-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .agent-stat .as-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .agent-stat .as-value { font-size: 1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }

  .positions-table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border-card); border-radius: var(--radius); overflow: hidden;
  }
  .positions-table th {
    background: var(--surface2); color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; text-align: left;
  }
  .positions-table td {
    padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.82rem;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .positions-table tr:hover { background: var(--surface2); }
  .tag-grid { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: var(--orange-bg); color: var(--orange); }
  .chart-container {
    background: var(--surface); border: 1px solid var(--border-card); border-radius: var(--radius);
    padding: 20px; margin-bottom: 14px;
  }
  .chart-container h2 { font-size: 0.85rem; font-weight: 700; margin-bottom: 14px; }
  canvas { max-height: 300px; }
  .charts-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(max-width: 768px) { .charts-two { grid-template-columns: 1fr; } }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .neutral { color: var(--text); }
  .footer {
    color: var(--text-dim); font-size: 0.7rem; text-align: center; margin-top: 28px;
    padding-top: 16px; border-top: 1px solid var(--border); font-family: var(--mono);
  }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); font-family: var(--mono); }
  .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>⚛️ Oliv<span>aris</span> Trading</h1>
    <div class="header-sub">Hyperliquid · Grid Era depuis 14 Mar 2026 · MAJ: <span id="updateTime">chargement...</span></div>
  </div>
  <div class="header-right">
    <span class="live-dot"></span><span class="live-label">LIVE</span>
    <span class="badge badge-paulo">🧠 Paulo · Grid Engine</span>
  </div>
</div>

<div id="hero-container"></div>

<div id="content">
  <div class="loading"><span class="spinner"></span> Chargement des données Hyperliquid...</div>
</div>

<div class="footer">
  ⚛️ Olivaris · Claudio (COO) · Paulo (Grid Engine) · Road to $1,000 · Dashboard v10
</div>

<script>
const WALLET = '0x73699b2aa74814b14Cb581BbF53A07A84140F942';
const HL_API = 'https://api.hyperliquid.xyz/info';
const TOTAL_DEPOSIT = 317.76;
const START_DATE = new Date('2026-02-12T00:01:00+01:00');
const GRID_START_DATE = new Date('2026-03-14T21:00:00Z');

const GRID_CONFIG = [
  { coin: 'BTC', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
  { coin: 'ETH', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
  { coin: 'SOL', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
];

const gridColor = '#1e1f2e';
const tickColor = '#6b7280';
const BLUE = '#3b82f6';
const GREEN = '#10b981';
const RED = '#ef4444';
const ORANGE = '#f59e0b';

let heroMode = 'grid';

async function hlPost(type, params = {}) {
  const r = await fetch(HL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, ...params })
  });
  return r.json();
}

function $(v) { return v >= 0 ? `$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`; }
function pct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function colorClass(v) { return v >= 0 ? 'green' : 'red'; }

function getDaysBetween(start, end) {
  const days = [];
  const d = new Date(start);
  d.setUTCHours(0, 0, 0, 0);
  const e = new Date(end);
  e.setUTCHours(0, 0, 0, 0);
  while (d <= e) {
    days.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return days;
}

function buildDailyPnl(fills, startTs) {
  const days = {};
  for (const f of fills) {
    if (f.time < startTs) continue;
    const day = new Date(f.time).toISOString().slice(0, 10);
    const pnl = parseFloat(f.closedPnl || 0);
    const fee = parseFloat(f.fee || 0);
    if (!days[day]) days[day] = { pnl: 0, fees: 0, count: 0 };
    days[day].pnl += pnl;
    days[day].fees += fee;
    days[day].count += 1;
  }
  return days;
}

function buildCoinPnl(fills, startTs) {
  const coins = {};
  for (const f of fills) {
    if (f.time < startTs) continue;
    const coin = f.coin;
    const pnl = parseFloat(f.closedPnl || 0);
    const fee = parseFloat(f.fee || 0);
    if (!coins[coin]) coins[coin] = { pnl: 0, fees: 0, count: 0 };
    coins[coin].pnl += pnl;
    coins[coin].fees += fee;
    coins[coin].count += 1;
  }
  return coins;
}

function fmtDate(d) {
  const [,m,day] = d.split('-');
  return `${parseInt(day)} ${['','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][parseInt(m)]}`;
}

async function loadDashboard() {
  try {
    const [state, allFills, gridFills, openOrders] = await Promise.all([
      hlPost('clearinghouseState', { user: WALLET }),
      hlPost('userFills', { user: WALLET }),
      hlPost('userFillsByTime', { user: WALLET, startTime: GRID_START_DATE.getTime() }),
      hlPost('openOrders', { user: WALLET }),
    ]);

    const equity = parseFloat(state.marginSummary.accountValue);
    const marginUsed = parseFloat(state.marginSummary.totalMarginUsed);
    const marginPct = equity > 0 ? (marginUsed / equity * 100) : 0;

    // ALL-TIME PNL
    const dailyAll = buildDailyPnl(allFills, START_DATE.getTime());
    const realizedPnlAll = Object.values(dailyAll).reduce((s, d) => s + d.pnl - d.fees, 0);
    const tradesAll = Object.values(dailyAll).reduce((s, d) => s + d.count, 0);

    // GRID ERA PNL
    const gridTs = GRID_START_DATE.getTime();
    const dailyGrid = buildDailyPnl(gridFills, gridTs);
    const realizedPnlGrid = Object.values(dailyGrid).reduce((s, d) => s + d.pnl - d.fees, 0);
    const tradesGrid = Object.values(dailyGrid).reduce((s, d) => s + d.count, 0);
    const daysGrid = Math.max(1, Math.floor((Date.now() - gridTs) / 86400000));
    const feesGrid = Object.values(dailyGrid).reduce((s, d) => s + d.fees, 0);
    const coinGrid = buildCoinPnl(gridFills, gridTs);

    // Positions
    const positions = (state.assetPositions || [])
      .filter(p => parseFloat(p.position.szi) !== 0)
      .map(p => p.position);
    const totalUnrealizedPnl = positions.reduce((s, p) => s + parseFloat(p.unrealizedPnl), 0);

    // Grid Status
    const gridCoins = ['BTC', 'ETH', 'SOL'];
    const gridOrdersStatus = {};
    for (const coin of gridCoins) {
      const coinOrders = openOrders.filter(o => o.coin === coin);
      const pos = positions.find(p => p.coin === coin);
      gridOrdersStatus[coin] = {
        actual: coinOrders.length,
        expected: 10,
        inventory: pos ? parseFloat(pos.szi) : 0
      };
    }
    const totalGridOrders = Object.values(gridOrdersStatus).reduce((s, g) => s + g.actual, 0);
    const totalExpected = 30;
    const gridHealthPct = (totalGridOrders / totalExpected * 100);
    const gridHealthIcon = gridHealthPct >= 80 ? '🟢' : (gridHealthPct >= 50 ? '🟡' : '🔴');
    const gridHealthLabel = gridHealthPct >= 80 ? 'Optimal' : (gridHealthPct >= 50 ? 'Partiel' : 'Dégradé');

    // Capital curve (all-time)
    const today = new Date();
    const dates = getDaysBetween(START_DATE, today);
    const capitalCurve = [];
    let remaining = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      capitalCurve.unshift(+(equity - remaining).toFixed(2));
      remaining += (dailyAll[dates[i]] ? dailyAll[dates[i]].pnl - dailyAll[dates[i]].fees : 0);
    }
    const dateLabels = dates.map(fmtDate);

    // Activity per day
    const activity = dates.map(d => dailyAll[d]?.count || 0);

    // Grid fills per day per coin
    const gridDates = getDaysBetween(GRID_START_DATE, today);
    const gridDateLabels = gridDates.map(fmtDate);
    const btcFillsPerDay = gridDates.map(d => gridFills.filter(f => f.coin === 'BTC' && new Date(f.time).toISOString().slice(0,10) === d).length);
    const ethFillsPerDay = gridDates.map(d => gridFills.filter(f => f.coin === 'ETH' && new Date(f.time).toISOString().slice(0,10) === d).length);
    const solFillsPerDay = gridDates.map(d => gridFills.filter(f => f.coin === 'SOL' && new Date(f.time).toISOString().slice(0,10) === d).length);

    // Grid cumulative PnL
    const gridCumulativePnl = gridDates.map((d, idx) => {
      let sum = 0;
      for (let i = 0; i <= idx; i++) {
        const dd = dailyGrid[gridDates[i]];
        if (dd) sum += dd.pnl - dd.fees;
      }
      return +sum.toFixed(2);
    });

    // Update time
    document.getElementById('updateTime').textContent = new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit', day: '2-digit', month: 'short', year: 'numeric' });

    // === HERO ===
    function renderHero() {
      if (heroMode === 'grid') {
        document.getElementById('hero-container').innerHTML = `
          <div class="hero ${realizedPnlGrid >= 0 ? 'positive' : 'negative'}">
            <div class="hero-label">PnL Réalisé · Grid Era</div>
            <div class="hero-value ${colorClass(realizedPnlGrid)}">${$(realizedPnlGrid)}</div>
            <div class="hero-detail">Grid Era · ${daysGrid} jours · ${tradesGrid} fills</div>
            <div class="hero-sub">
              <div class="hero-sub-item">
                <div class="hero-sub-label">Non-réalisé</div>
                <div class="hero-sub-value ${colorClass(totalUnrealizedPnl)}">${$(totalUnrealizedPnl)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Capital</div>
                <div class="hero-sub-value neutral">${$(equity)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Marge</div>
                <div class="hero-sub-value neutral">${marginPct.toFixed(1)}%</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Ordres</div>
                <div class="hero-sub-value neutral">${totalGridOrders}/30</div>
              </div>
            </div>
            <div class="hero-toggle">
              <button class="hero-toggle-btn" onclick="heroMode='alltime'; renderHero();">Voir All-time</button>
            </div>
          </div>`;
      } else {
        const daysAlltime = Math.floor((Date.now() - START_DATE.getTime()) / 86400000);
        document.getElementById('hero-container').innerHTML = `
          <div class="hero ${realizedPnlAll >= 0 ? 'positive' : 'negative'}">
            <div class="hero-label">PnL Réalisé · All-time</div>
            <div class="hero-value ${colorClass(realizedPnlAll)}">${$(realizedPnlAll)}</div>
            <div class="hero-detail">Depuis le 12 Feb · ${daysAlltime} jours · ${tradesAll} fills</div>
            <div class="hero-sub">
              <div class="hero-sub-item">
                <div class="hero-sub-label">Non-réalisé</div>
                <div class="hero-sub-value ${colorClass(totalUnrealizedPnl)}">${$(totalUnrealizedPnl)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Capital</div>
                <div class="hero-sub-value neutral">${$(equity)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">vs Dépôt</div>
                <div class="hero-sub-value ${colorClass(equity - TOTAL_DEPOSIT)}">${pct((equity - TOTAL_DEPOSIT) / TOTAL_DEPOSIT * 100)}</div>
              </div>
            </div>
            <div class="hero-toggle">
              <button class="hero-toggle-btn" onclick="heroMode='grid'; renderHero();">Voir Grid Era</button>
            </div>
          </div>`;
      }
    }
    window.heroMode = heroMode;
    window.renderHero = renderHero;
    renderHero();

    // === RENDER ===
    const pnlVsDeposit = equity - TOTAL_DEPOSIT;
    document.getElementById('content').innerHTML = `
      <!-- SUMMARY -->
      <div class="section">
        <div class="section-title">Vue d'ensemble</div>
        <div class="summary-grid">
          <div class="summary-card">
            <div class="label">Capital</div>
            <div class="value neutral">${$(equity)}</div>
            <div class="detail">Marge: ${marginPct.toFixed(1)}%</div>
          </div>
          <div class="summary-card">
            <div class="label">Total Déposé</div>
            <div class="value neutral">${$(TOTAL_DEPOSIT)}</div>
          </div>
          <div class="summary-card">
            <div class="label">PnL vs Dépôt</div>
            <div class="value ${colorClass(pnlVsDeposit)}">${$(pnlVsDeposit)}</div>
            <div class="detail">${pct(pnlVsDeposit / TOTAL_DEPOSIT * 100)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Positions</div>
            <div class="value neutral">${positions.length}</div>
            <div class="detail">Grid inventory</div>
          </div>
          <div class="summary-card">
            <div class="label">Objectif</div>
            <div class="value neutral">$1,000</div>
            <div class="detail">${pct(equity / 1000 * 100 - 100)} restant</div>
          </div>
        </div>
      </div>

      <!-- GRID STATUS -->
      <div class="section">
        <div class="section-title" style="color: var(--violet-electric);">⚡ Grid Status</div>
        <div class="grid-status-container">
          <div class="grid-config-line">Config: 0.8% spread · 5 niveaux · $30/niveau · rebalance 48h</div>
          <div class="grid-health">
            <div class="grid-health-icon">${gridHealthIcon}</div>
            <div class="grid-health-text">
              <div class="grid-health-label">Santé Globale</div>
              <div class="grid-health-status">${gridHealthLabel} · ${totalGridOrders}/${totalExpected} ordres (${gridHealthPct.toFixed(0)}%)</div>
            </div>
          </div>
          <div class="grid-coins">
            ${gridCoins.map(coin => {
              const gs = gridOrdersStatus[coin];
              const progPct = (gs.actual / gs.expected * 100).toFixed(0);
              const progColor = progPct >= 80 ? GREEN : (progPct >= 50 ? ORANGE : RED);
              return `
                <div class="grid-coin">
                  <div class="grid-coin-header">
                    <div class="grid-coin-name">${coin}</div>
                    <div class="grid-coin-count">${gs.actual}/${gs.expected}</div>
                  </div>
                  <div class="grid-coin-progress">
                    <div class="grid-coin-progress-bar" style="width: ${progPct}%; background: ${progColor};"></div>
                  </div>
                  <div class="grid-coin-inventory">Inventory: ${gs.inventory > 0 ? '+' : ''}${gs.inventory.toFixed(4)}</div>
                </div>`;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- GRID PERFORMANCE -->
      <div class="section">
        <div class="section-title" style="color: var(--violet-electric);">📊 Grid Performance</div>
        <div class="grid-perf-stats">
          <div class="grid-perf-stat"><div class="label">Fills Grid</div><div class="value neutral">${tradesGrid}</div></div>
          <div class="grid-perf-stat"><div class="label">BTC</div><div class="value blue">${coinGrid.BTC?.count || 0} fills</div></div>
          <div class="grid-perf-stat"><div class="label">ETH</div><div class="value blue">${coinGrid.ETH?.count || 0} fills</div></div>
          <div class="grid-perf-stat"><div class="label">SOL</div><div class="value blue">${coinGrid.SOL?.count || 0} fills</div></div>
          <div class="grid-perf-stat"><div class="label">PnL Grid Net</div><div class="value ${colorClass(realizedPnlGrid)}">${$(realizedPnlGrid)}</div></div>
          <div class="grid-perf-stat"><div class="label">Fees Grid</div><div class="value red">-${feesGrid.toFixed(4)}</div></div>
        </div>
        <div class="charts-two">
          <div class="chart-container"><h2>Fills par Jour (Grid Era)</h2><canvas id="gridFillsChart"></canvas></div>
          <div class="chart-container"><h2>PnL Cumulé Post-Grid</h2><canvas id="gridPnlChart"></canvas></div>
        </div>
      </div>

      <!-- CAPITAL CHART -->
      <div class="section">
        <div class="section-title">📈 Évolution du Capital</div>
        <div class="chart-container">
          <canvas id="capitalChart"></canvas>
        </div>
      </div>

      <!-- AGENT -->
      <div class="section">
        <div class="section-title">🤖 Agent</div>
        <div class="agent-card">
          <div class="agent-header">
            <div>
              <div class="agent-name">🧠 Paulo</div>
              <div class="agent-role">Quant · Grid Engine · BTC / ETH / SOL</div>
            </div>
            <span class="badge badge-paulo">ACTIF</span>
          </div>
          <div class="agent-stats">
            <div class="agent-stat"><div class="as-label">Capital</div><div class="as-value">${$(equity)}</div></div>
            <div class="agent-stat"><div class="as-label">PnL Grid</div><div class="as-value ${colorClass(realizedPnlGrid)}">${$(realizedPnlGrid)}</div></div>
            <div class="agent-stat"><div class="as-label">Marge</div><div class="as-value">${marginPct.toFixed(1)}%</div></div>
            <div class="agent-stat"><div class="as-label">Fills Grid</div><div class="as-value">${tradesGrid}</div></div>
            <div class="agent-stat"><div class="as-label">Ordres Actifs</div><div class="as-value">${totalGridOrders}/30</div></div>
            <div class="agent-stat"><div class="as-label">Positions</div><div class="as-value">${positions.length}</div></div>
          </div>
        </div>
      </div>

      <!-- POSITIONS -->
      <div class="section">
        <div class="section-title">📍 Positions Ouvertes</div>
        ${positions.length > 0 ? `
        <table class="positions-table">
          <thead><tr><th>Coin</th><th>Side</th><th>Size</th><th>Entry</th><th>uPnL</th><th>Lev</th><th>Context</th></tr></thead>
          <tbody>
            ${positions.map(p => {
              const szi = parseFloat(p.szi);
              const isLong = szi > 0;
              const upnl = parseFloat(p.unrealizedPnl);
              const lev = p.leverage ? (p.leverage.value + '×') : '—';
              return `<tr>
                <td><strong>${p.coin}</strong></td>
                <td class="${isLong ? 'green' : 'red'}">${isLong ? 'LONG' : 'SHORT'}</td>
                <td>${Math.abs(szi).toFixed(4)}</td>
                <td>$${parseFloat(p.entryPx).toFixed(2)}</td>
                <td class="${colorClass(upnl)}">${$(upnl)}</td>
                <td>${lev}</td>
                <td><span class="tag-grid">GRID</span></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>` : `<div style="color:var(--text-muted);font-family:var(--mono);font-size:0.82rem;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">Aucune position ouverte</div>`}
      </div>

      <!-- ACTIVITY CHART -->
      <div class="section">
        <div class="section-title">📊 Activité All-time</div>
        <div class="charts-two">
          <div class="chart-container"><h2>Fills par Jour</h2><canvas id="activityChart"></canvas></div>
          <div class="chart-container"><h2>Marge Utilisée</h2><canvas id="marginChart"></canvas></div>
        </div>
      </div>
    `;

    // === CHARTS ===
    const ttOpts = { backgroundColor: '#1a1b25', borderColor: '#2a2b38', borderWidth: 1, titleFont: { family: "'Inter'" }, bodyFont: { family: "'JetBrains Mono'" } };

    new Chart(document.getElementById('gridFillsChart'), {
      type: 'bar',
      data: {
        labels: gridDateLabels,
        datasets: [
          { label: 'BTC', data: btcFillsPerDay, backgroundColor: 'rgba(245,158,11,0.6)', borderRadius: 6 },
          { label: 'ETH', data: ethFillsPerDay, backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 6 },
          { label: 'SOL', data: solFillsPerDay, backgroundColor: 'rgba(168,85,247,0.6)', borderRadius: 6 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: tickColor, usePointStyle: true } }, tooltip: ttOpts },
        scales: {
          x: { stacked: true, ticks: { color: tickColor }, grid: { color: gridColor } },
          y: { stacked: true, ticks: { color: tickColor }, grid: { color: gridColor } }
        }
      }
    });

    new Chart(document.getElementById('gridPnlChart'), {
      type: 'line',
      data: {
        labels: gridDateLabels,
        datasets: [{ label: 'PnL Cumulé', data: gridCumulativePnl, borderColor: GREEN, backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.3, pointRadius: 4, borderWidth: 2.5 }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: tickColor } }, tooltip: { ...ttOpts, callbacks: { label: ctx => `PnL: $${ctx.parsed.y}` } } },
        scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, callback: v => '$' + v }, grid: { color: gridColor } } }
      }
    });

    const gridStartIndex = dates.findIndex(d => d === GRID_START_DATE.toISOString().slice(0, 10));
    new Chart(document.getElementById('capitalChart'), {
      type: 'line',
      data: {
        labels: dateLabels,
        datasets: [
          { label: 'Capital', data: capitalCurve, borderColor: GREEN, backgroundColor: 'rgba(16,185,129,0.08)', fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: GREEN, borderWidth: 2.5 },
          { label: 'Départ $317.76', data: dateLabels.map(() => TOTAL_DEPOSIT), borderColor: '#374151', borderDash: [6, 4], pointRadius: 0, borderWidth: 1, fill: false }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: tickColor, usePointStyle: true, pointStyle: 'circle', padding: 16, font: { family: "'Inter'", size: 11 } } },
          tooltip: { ...ttOpts, callbacks: { label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}` } }
        },
        scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, callback: v => '$' + v }, grid: { color: gridColor } } }
      },
      plugins: gridStartIndex >= 0 ? [{
        id: 'gridEraMarker',
        afterDatasetsDraw(chart) {
          const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
          const xPos = x.getPixelForValue(gridStartIndex);
          ctx.save();
          ctx.strokeStyle = ORANGE;
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 4]);
          ctx.beginPath();
          ctx.moveTo(xPos, top);
          ctx.lineTo(xPos, bottom);
          ctx.stroke();
          ctx.fillStyle = 'rgba(245,158,11,0.85)';
          ctx.font = "bold 10px 'JetBrains Mono'";
          ctx.fillText('Grid Era', xPos + 6, top + 14);
          ctx.restore();
        }
      }] : []
    });

    new Chart(document.getElementById('activityChart'), {
      type: 'bar',
      data: { labels: dateLabels, datasets: [{ label: 'Fills', data: activity, backgroundColor: 'rgba(59,130,246,0.5)', borderRadius: 4 }] },
      options: { responsive: true, plugins: { legend: { labels: { color: tickColor } }, tooltip: ttOpts }, scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor }, grid: { color: gridColor } } } }
    });

    new Chart(document.getElementById('marginChart'), {
      type: 'bar',
      data: { labels: ['Paulo'], datasets: [
        { label: 'Marge', data: [marginPct], backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 8 },
        { label: 'Seuil (75%)', data: [75], backgroundColor: 'rgba(239,68,68,0.15)', borderRadius: 0 }
      ]},
      options: { responsive: true, indexAxis: 'y', plugins: { legend: { labels: { color: tickColor } }, tooltip: ttOpts }, scales: { x: { max: 100, ticks: { color: tickColor, callback: v => v + '%' }, grid: { color: gridColor } }, y: { ticks: { color: tickColor }, grid: { color: gridColor } } } }
    });

  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ Erreur: ${err.message}<br><br><button onclick="loadDashboard()" style="padding:8px 16px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:var(--mono);">Réessayer</button></div>`;
  }
}

loadDashboard();
</script>
</body>
</html>
