<style>
  :root {
    --bg: #0a0b0f;
    --surface: #12131a;
    --surface2: #1a1b25;
    --border: #2a2b38;
    --text: #e8eaed;
    --text-muted: #6b7280;
    --text-dim: #4b5563;
    --green: #10b981;
    --green-bg: rgba(16, 185, 129, 0.1);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.1);
    --blue: #3b82f6;
    --blue-bg: rgba(59, 130, 246, 0.1);
    --purple: #a855f7;
    --purple-bg: rgba(168, 85, 247, 0.1);
    --orange: #f59e0b;
    --orange-bg: rgba(245, 158, 11, 0.1);
    --radius: 12px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', 'Fira Code', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 1400px;
    margin: 0 auto;
    line-height: 1.5;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .header-left h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .header-left h1 span { color: var(--blue); }
  .header-sub { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; font-family: var(--mono); }
  .header-right { display: flex; gap: 8px; align-items: center; }
  .badge { font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; font-family: var(--mono); }
  .badge-paulo { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .badge-andro { background: var(--purple-bg); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; margin-right: 4px; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .live-label { font-size: 0.7rem; color: var(--green); font-family: var(--mono); }

  /* HERO PNL */
  .hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 28px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .hero.positive::before { background: linear-gradient(90deg, var(--green), #34d399, var(--green)); }
  .hero.negative::before { background: linear-gradient(90deg, var(--red), #f87171, var(--red)); }
  .hero-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
  .hero-value { font-size: 3.2rem; font-weight: 800; font-family: var(--mono); letter-spacing: -0.03em; }
  .hero-detail { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-family: var(--mono); }
  .hero-sub { display: flex; justify-content: center; gap: 32px; margin-top: 16px; flex-wrap: wrap; }
  .hero-sub-item { text-align: center; }
  .hero-sub-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .hero-sub-value { font-size: 1.1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
  .hero-toggle { margin-top: 12px; }
  .hero-toggle-btn { 
    background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); 
    padding: 6px 14px; border-radius: 6px; font-family: var(--mono); font-size: 0.7rem; 
    cursor: pointer; transition: all 150ms ease;
  }
  .hero-toggle-btn:hover { border-color: var(--blue); color: var(--blue); }

  .section { margin-bottom: 28px; }
  .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 14px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px; transition: border-color 200ms ease;
  }
  .summary-card:hover { border-color: var(--text-dim); }
  .summary-card .label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px; }
  .summary-card .value { font-size: 1.6rem; font-weight: 800; font-family: var(--mono); letter-spacing: -0.02em; }
  .summary-card .detail { font-size: 0.72rem; color: var(--text-muted); margin-top: 4px; font-family: var(--mono); }

  /* GRID STATUS */
  .grid-status-container {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px;
  }
  .grid-config-line {
    font-size: 0.72rem; color: var(--text-muted); font-family: var(--mono);
    margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .grid-health {
    display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    padding: 12px 16px; background: var(--surface2); border-radius: 8px;
  }
  .grid-health-icon { font-size: 1.4rem; }
  .grid-health-text { flex: 1; }
  .grid-health-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
  .grid-health-status { font-size: 1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
  .grid-coins { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .grid-coin {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px;
  }
  .grid-coin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .grid-coin-name { font-size: 1rem; font-weight: 700; }
  .grid-coin-count { font-size: 0.72rem; font-family: var(--mono); color: var(--text-muted); }
  .grid-coin-progress { 
    width: 100%; height: 6px; background: var(--border); border-radius: 3px; 
    overflow: hidden; margin-bottom: 8px;
  }
  .grid-coin-progress-bar { height: 100%; transition: width 200ms ease; }
  .grid-coin-inventory { font-size: 0.75rem; color: var(--text-muted); font-family: var(--mono); }

  /* GRID PERFORMANCE */
  .grid-perf-stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;
    margin-bottom: 18px;
  }
  .grid-perf-stat {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px;
  }
  .grid-perf-stat .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .grid-perf-stat .value { font-size: 1.3rem; font-weight: 700; font-family: var(--mono); margin-top: 4px; }

  .agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(max-width: 768px) { .agent-grid { grid-template-columns: 1fr; } }
  .agent-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; position: relative; overflow: hidden;
  }
  .agent-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .agent-card.paulo::before { background: linear-gradient(90deg, var(--blue), #60a5fa); }
  .agent-card.andro::before { background: linear-gradient(90deg, var(--purple), #c084fc); }
  .agent-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .agent-name { font-size: 1.1rem; font-weight: 800; }
  .agent-name.paulo { color: var(--blue); }
  .agent-name.andro { color: var(--purple); }
  .agent-role { font-size: 0.68rem; color: var(--text-muted); font-family: var(--mono); }
  .agent-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .agent-stat .as-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .agent-stat .as-value { font-size: 1rem; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
  .positions-table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
  }
  .positions-table th {
    background: var(--surface2); color: var(--text-muted); font-size: 0.68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 14px; text-align: left;
  }
  .positions-table td {
    padding: 10px 14px; border-top: 1px solid var(--border); font-size: 0.82rem;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .positions-table tr:hover { background: var(--surface2); }
  .agent-tag { font-size: 0.6rem; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
  .tag-paulo { background: var(--blue-bg); color: var(--blue); }
  .tag-andro { background: var(--purple-bg); color: var(--purple); }
  .tag-grid { background: var(--orange-bg); color: var(--orange); margin-left: 4px; }
  .chart-container {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 14px;
  }
  .chart-container h2 { font-size: 0.85rem; font-weight: 700; margin-bottom: 14px; }
  canvas { max-height: 300px; }
  .charts-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media(max-width: 768px) { .charts-two { grid-template-columns: 1fr; } }
  .green { color: var(--green); }
  .red { color: var(--red); }
  .blue { color: var(--blue); }
  .purple { color: var(--purple); }
  .neutral { color: var(--text); }
  .footer {
    color: var(--text-dim); font-size: 0.7rem; text-align: center; margin-top: 28px;
    padding-top: 16px; border-top: 1px solid var(--border); font-family: var(--mono);
  }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); font-family: var(--mono); }
  .loading .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
const PAULO_WALLET = '0x73699b2aa74814b14Cb581BbF53A07A84140F942';
const ANDRO_WALLET = '0xeBee34176A218FA517Db163DD1A7aaA944c66d86';
const HL_API = 'https://api.hyperliquid.xyz/info';
const TOTAL_DEPOSIT = 317.76;
const PAULO_ALLOC = 219.76;
const ANDRO_ALLOC = 98.00;
const START_DATE = new Date('2026-02-12T00:01:00+01:00');
const GRID_START_DATE = new Date('2026-03-14T21:00:00Z');

const GRID_CONFIG = [
  { coin: 'BTC', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
  { coin: 'ETH', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
  { coin: 'SOL', gridPct: 0.008, levels: 5, notionalPerLevel: 30, rebalanceHours: 48 },
];

const gridColor = '#1e1f2e';
const tickColor = '#6b7280';
const BLUE = '#3b82f6';
const PURPLE = '#a855f7';
const GREEN = '#10b981';
const RED = '#ef4444';
const ORANGE = '#f59e0b';

let heroMode = 'grid'; // 'grid' or 'alltime'

async function hlPost(type, params = {}) {
  const r = await fetch(HL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, ...params })
  });
  return r.json();
}

function $(v) { return v >= 0 ? `$${v.toFixed(2)}` : `-$${Math.abs(v).toFixed(2)}`; }
function pct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function colorClass(v) { return v >= 0 ? 'green' : 'red'; }

function getDaysBetween(start, end) {
  const days = [];
  const d = new Date(start);
  d.setUTCHours(0, 0, 0, 0);
  const e = new Date(end);
  e.setUTCHours(0, 0, 0, 0);
  while (d <= e) {
    days.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return days;
}

function buildDailyPnl(fills, startTs) {
  const days = {};
  for (const f of fills) {
    if (f.time < startTs) continue;
    const day = new Date(f.time).toISOString().slice(0, 10);
    const pnl = parseFloat(f.closedPnl || 0);
    const fee = parseFloat(f.fee || 0);
    if (!days[day]) days[day] = { pnl: 0, fees: 0, count: 0 };
    days[day].pnl += pnl;
    days[day].fees += fee;
    days[day].count += 1;
  }
  return days;
}

function buildCoinPnl(fills, startTs) {
  const coins = {};
  for (const f of fills) {
    if (f.time < startTs) continue;
    const coin = f.coin;
    const pnl = parseFloat(f.closedPnl || 0);
    const fee = parseFloat(f.fee || 0);
    if (!coins[coin]) coins[coin] = { pnl: 0, fees: 0, count: 0 };
    coins[coin].pnl += pnl;
    coins[coin].fees += fee;
    coins[coin].count += 1;
  }
  return coins;
}

function fmtDate(d) {
  const [,m,day] = d.split('-');
  return `${parseInt(day)} ${['','Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'][parseInt(m)]}`;
}

async function loadDashboard() {
  try {
    const [pauloState, androState, pauloFills, androFills, pauloGridFills, androGridFills, pauloOrders, androOrders] = await Promise.all([
      hlPost('clearinghouseState', { user: PAULO_WALLET }),
      hlPost('clearinghouseState', { user: ANDRO_WALLET }),
      hlPost('userFills', { user: PAULO_WALLET }),
      hlPost('userFills', { user: ANDRO_WALLET }),
      hlPost('userFillsByTime', { user: PAULO_WALLET, startTime: GRID_START_DATE.getTime() }),
      hlPost('userFillsByTime', { user: ANDRO_WALLET, startTime: GRID_START_DATE.getTime() }),
      hlPost('openOrders', { user: PAULO_WALLET }),
      hlPost('openOrders', { user: ANDRO_WALLET }),
    ]);

    const pauloEquity = parseFloat(pauloState.marginSummary.accountValue);
    const androEquity = parseFloat(androState.marginSummary.accountValue);
    const totalEquity = pauloEquity + androEquity;

    const pauloMarginUsed = parseFloat(pauloState.marginSummary.totalMarginUsed);
    const androMarginUsed = parseFloat(androState.marginSummary.totalMarginUsed);
    const pauloMarginPct = pauloEquity > 0 ? (pauloMarginUsed / pauloEquity * 100) : 0;
    const androMarginPct = androEquity > 0 ? (androMarginUsed / androEquity * 100) : 0;

    // ALL-TIME PNL
    const startTs = START_DATE.getTime();
    const pauloDaily = buildDailyPnl(pauloFills, startTs);
    const androDaily = buildDailyPnl(androFills, startTs);
    const pauloRealizedPnlAlltime = Object.values(pauloDaily).reduce((s, d) => s + d.pnl - d.fees, 0);
    const androRealizedPnlAlltime = Object.values(androDaily).reduce((s, d) => s + d.pnl - d.fees, 0);
    const totalRealizedPnlAlltime = pauloRealizedPnlAlltime + androRealizedPnlAlltime;
    const totalTradesAlltime = Object.values(pauloDaily).reduce((s, d) => s + d.count, 0) + Object.values(androDaily).reduce((s, d) => s + d.count, 0);

    // GRID ERA PNL
    const gridTs = GRID_START_DATE.getTime();
    const pauloDailyGrid = buildDailyPnl(pauloGridFills, gridTs);
    const androDailyGrid = buildDailyPnl(androGridFills, gridTs);
    const pauloRealizedPnlGrid = Object.values(pauloDailyGrid).reduce((s, d) => s + d.pnl - d.fees, 0);
    const androRealizedPnlGrid = Object.values(androDailyGrid).reduce((s, d) => s + d.pnl - d.fees, 0);
    const totalRealizedPnlGrid = pauloRealizedPnlGrid + androRealizedPnlGrid;
    const totalTradesGrid = Object.values(pauloDailyGrid).reduce((s, d) => s + d.count, 0) + Object.values(androDailyGrid).reduce((s, d) => s + d.count, 0);
    const daysGrid = Math.floor((Date.now() - GRID_START_DATE.getTime()) / 86400000);

    // GRID COIN PNL
    const pauloCoinGrid = buildCoinPnl(pauloGridFills, gridTs);
    const androCoinGrid = buildCoinPnl(androGridFills, gridTs);
    const totalFeesGrid = Object.values(pauloDailyGrid).reduce((s, d) => s + d.fees, 0) + Object.values(androDailyGrid).reduce((s, d) => s + d.fees, 0);

    // Capital curves
    const today = new Date();
    const dates = getDaysBetween(START_DATE, today);
    const pauloCurve = [];
    const androCurve = [];
    let pauloRemaining = 0;
    let androRemaining = 0;
    for (let i = dates.length - 1; i >= 0; i--) {
      const d = dates[i];
      pauloCurve.unshift(+(pauloEquity - pauloRemaining).toFixed(2));
      androCurve.unshift(+(androEquity - androRemaining).toFixed(2));
      pauloRemaining += (pauloDaily[d] ? pauloDaily[d].pnl - pauloDaily[d].fees : 0);
      androRemaining += (androDaily[d] ? androDaily[d].pnl - androDaily[d].fees : 0);
    }
    const totalCurve = pauloCurve.map((p, i) => +(p + androCurve[i]).toFixed(2));
    const dateLabels = dates.map(fmtDate);

    // Positions
    const pauloPositions = (pauloState.assetPositions || [])
      .filter(p => parseFloat(p.position.szi) !== 0)
      .map(p => ({ ...p.position, agent: 'PAULO' }));
    const androPositions = (androState.assetPositions || [])
      .filter(p => parseFloat(p.position.szi) !== 0)
      .map(p => ({ ...p.position, agent: 'ANDRO' }));
    const allPositions = [...pauloPositions, ...androPositions];

    // Unrealized PnL
    const totalUnrealizedPnl = allPositions.reduce((s, p) => s + parseFloat(p.unrealizedPnl), 0);

    // Grid Status
    const pauloOpenOrders = pauloOrders || [];
    const gridCoins = ['BTC', 'ETH', 'SOL'];
    const gridOrdersStatus = {};
    for (const coin of gridCoins) {
      const ordersForCoin = pauloOpenOrders.filter(o => o.coin === coin);
      const expected = 10; // 5 buy + 5 sell
      const actual = ordersForCoin.length;
      const posForCoin = pauloPositions.find(p => p.coin === coin);
      const inventory = posForCoin ? parseFloat(posForCoin.szi) : 0;
      gridOrdersStatus[coin] = { actual, expected, inventory };
    }
    const totalGridOrders = Object.values(gridOrdersStatus).reduce((s, g) => s + g.actual, 0);
    const totalExpected = gridCoins.length * 10;
    const gridHealthPct = totalExpected > 0 ? (totalGridOrders / totalExpected * 100) : 0;
    const gridHealthIcon = gridHealthPct >= 80 ? '🟢' : (gridHealthPct >= 50 ? '🟡' : '🔴');
    const gridHealthLabel = gridHealthPct >= 80 ? 'Optimal' : (gridHealthPct >= 50 ? 'Partiel' : 'Dégradé');

    // Activity per day
    const pauloActivity = dates.map(d => pauloDaily[d]?.count || 0);
    const androActivity = dates.map(d => androDaily[d]?.count || 0);

    // Grid fills per day
    const gridDates = getDaysBetween(GRID_START_DATE, today);
    const gridDateLabels = gridDates.map(fmtDate);
    const btcFillsPerDay = gridDates.map(d => {
      const pFills = pauloGridFills.filter(f => f.coin === 'BTC' && new Date(f.time).toISOString().slice(0,10) === d).length;
      const aFills = androGridFills.filter(f => f.coin === 'BTC' && new Date(f.time).toISOString().slice(0,10) === d).length;
      return pFills + aFills;
    });
    const ethFillsPerDay = gridDates.map(d => {
      const pFills = pauloGridFills.filter(f => f.coin === 'ETH' && new Date(f.time).toISOString().slice(0,10) === d).length;
      const aFills = androGridFills.filter(f => f.coin === 'ETH' && new Date(f.time).toISOString().slice(0,10) === d).length;
      return pFills + aFills;
    });
    const solFillsPerDay = gridDates.map(d => {
      const pFills = pauloGridFills.filter(f => f.coin === 'SOL' && new Date(f.time).toISOString().slice(0,10) === d).length;
      const aFills = androGridFills.filter(f => f.coin === 'SOL' && new Date(f.time).toISOString().slice(0,10) === d).length;
      return pFills + aFills;
    });

    // Grid cumulative PnL
    const gridCumulativePnl = gridDates.map((d, idx) => {
      let sum = 0;
      for (let i = 0; i <= idx; i++) {
        const dayData = [...Object.entries(pauloDailyGrid), ...Object.entries(androDailyGrid)].filter(([day]) => day === gridDates[i]);
        for (const [, data] of dayData) {
          sum += data.pnl - data.fees;
        }
      }
      return sum.toFixed(2);
    });

    // Update time
    document.getElementById('updateTime').textContent = new Date().toLocaleString('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit', day: '2-digit', month: 'short', year: 'numeric' });

    // === HERO PNL ===
    function renderHero() {
      if (heroMode === 'grid') {
        document.getElementById('hero-container').innerHTML = `
          <div class="hero ${totalRealizedPnlGrid >= 0 ? 'positive' : 'negative'}">
            <div class="hero-label">PnL Réalisé · Grid Era</div>
            <div class="hero-value ${colorClass(totalRealizedPnlGrid)}">${$(totalRealizedPnlGrid)}</div>
            <div class="hero-detail">Grid Era · ${daysGrid} jours · ${totalTradesGrid} fills</div>
            <div class="hero-sub">
              <div class="hero-sub-item">
                <div class="hero-sub-label">Paulo</div>
                <div class="hero-sub-value ${colorClass(pauloRealizedPnlGrid)}">${$(pauloRealizedPnlGrid)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Andro</div>
                <div class="hero-sub-value ${colorClass(androRealizedPnlGrid)}">${$(androRealizedPnlGrid)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Non-réalisé</div>
                <div class="hero-sub-value ${colorClass(totalUnrealizedPnl)}">${$(totalUnrealizedPnl)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Capital</div>
                <div class="hero-sub-value neutral">${$(totalEquity)}</div>
              </div>
            </div>
            <div class="hero-toggle">
              <button class="hero-toggle-btn" onclick="heroMode='alltime'; renderHero();">Voir All-time</button>
            </div>
          </div>
        `;
      } else {
        const daysAlltime = Math.floor((Date.now() - START_DATE.getTime()) / 86400000);
        document.getElementById('hero-container').innerHTML = `
          <div class="hero ${totalRealizedPnlAlltime >= 0 ? 'positive' : 'negative'}">
            <div class="hero-label">PnL Réalisé · All-time</div>
            <div class="hero-value ${colorClass(totalRealizedPnlAlltime)}">${$(totalRealizedPnlAlltime)}</div>
            <div class="hero-detail">Depuis le 12 Feb · ${daysAlltime} jours · ${totalTradesAlltime} fills</div>
            <div class="hero-sub">
              <div class="hero-sub-item">
                <div class="hero-sub-label">Paulo</div>
                <div class="hero-sub-value ${colorClass(pauloRealizedPnlAlltime)}">${$(pauloRealizedPnlAlltime)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Andro</div>
                <div class="hero-sub-value ${colorClass(androRealizedPnlAlltime)}">${$(androRealizedPnlAlltime)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Non-réalisé</div>
                <div class="hero-sub-value ${colorClass(totalUnrealizedPnl)}">${$(totalUnrealizedPnl)}</div>
              </div>
              <div class="hero-sub-item">
                <div class="hero-sub-label">Capital</div>
                <div class="hero-sub-value neutral">${$(totalEquity)}</div>
              </div>
            </div>
            <div class="hero-toggle">
              <button class="hero-toggle-btn" onclick="heroMode='grid'; renderHero();">Voir Grid Era</button>
            </div>
          </div>
        `;
      }
    }
    window.heroMode = heroMode;
    window.renderHero = renderHero;
    renderHero();

    // === RENDER ===
    document.getElementById('content').innerHTML = `
      <!-- GRID STATUS -->
      <div class="section">
        <div class="section-title">⚡ Grid Status</div>
        <div class="grid-status-container">
          <div class="grid-config-line">
            Config: 0.8% spread · 5 niveaux · $30/niveau · rebalance 48h
          </div>
          <div class="grid-health">
            <div class="grid-health-icon">${gridHealthIcon}</div>
            <div class="grid-health-text">
              <div class="grid-health-label">Santé Globale</div>
              <div class="grid-health-status">${gridHealthLabel} · ${totalGridOrders}/${totalExpected} ordres (${gridHealthPct.toFixed(0)}%)</div>
            </div>
          </div>
          <div class="grid-coins">
            ${gridCoins.map(coin => {
              const gs = gridOrdersStatus[coin];
              const progPct = (gs.actual / gs.expected * 100).toFixed(0);
              const progColor = progPct >= 80 ? GREEN : (progPct >= 50 ? ORANGE : RED);
              return `
                <div class="grid-coin">
                  <div class="grid-coin-header">
                    <div class="grid-coin-name">${coin}</div>
                    <div class="grid-coin-count">${gs.actual}/${gs.expected}</div>
                  </div>
                  <div class="grid-coin-progress">
                    <div class="grid-coin-progress-bar" style="width: ${progPct}%; background: ${progColor};"></div>
                  </div>
                  <div class="grid-coin-inventory">Inventory: ${gs.inventory > 0 ? '+' : ''}${gs.inventory.toFixed(4)}</div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      </div>

      <!-- GRID PERFORMANCE -->
      <div class="section">
        <div class="section-title">📊 Grid Performance</div>
        <div class="grid-perf-stats">
          <div class="grid-perf-stat">
            <div class="label">Fills Post-Grid</div>
            <div class="value neutral">${totalTradesGrid}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">BTC Fills</div>
            <div class="value blue">${(pauloCoinGrid.BTC?.count || 0) + (androCoinGrid.BTC?.count || 0)}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">ETH Fills</div>
            <div class="value blue">${(pauloCoinGrid.ETH?.count || 0) + (androCoinGrid.ETH?.count || 0)}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">SOL Fills</div>
            <div class="value blue">${(pauloCoinGrid.SOL?.count || 0) + (androCoinGrid.SOL?.count || 0)}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">BTC PnL</div>
            <div class="value ${colorClass((pauloCoinGrid.BTC?.pnl || 0) + (androCoinGrid.BTC?.pnl || 0) - (pauloCoinGrid.BTC?.fees || 0) - (androCoinGrid.BTC?.fees || 0))}">${$((pauloCoinGrid.BTC?.pnl || 0) + (androCoinGrid.BTC?.pnl || 0) - (pauloCoinGrid.BTC?.fees || 0) - (androCoinGrid.BTC?.fees || 0))}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">ETH PnL</div>
            <div class="value ${colorClass((pauloCoinGrid.ETH?.pnl || 0) + (androCoinGrid.ETH?.pnl || 0) - (pauloCoinGrid.ETH?.fees || 0) - (androCoinGrid.ETH?.fees || 0))}">${$((pauloCoinGrid.ETH?.pnl || 0) + (androCoinGrid.ETH?.pnl || 0) - (pauloCoinGrid.ETH?.fees || 0) - (androCoinGrid.ETH?.fees || 0))}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">SOL PnL</div>
            <div class="value ${colorClass((pauloCoinGrid.SOL?.pnl || 0) + (androCoinGrid.SOL?.pnl || 0) - (pauloCoinGrid.SOL?.fees || 0) - (androCoinGrid.SOL?.fees || 0))}">${$((pauloCoinGrid.SOL?.pnl || 0) + (androCoinGrid.SOL?.pnl || 0) - (pauloCoinGrid.SOL?.fees || 0) - (androCoinGrid.SOL?.fees || 0))}</div>
          </div>
          <div class="grid-perf-stat">
            <div class="label">Fees Cumulés</div>
            <div class="value red">-${totalFeesGrid.toFixed(2)}</div>
          </div>
        </div>
        <div class="charts-two">
          <div class="chart-container"><h2>Fills par Jour (Grid Era)</h2><canvas id="gridFillsChart"></canvas></div>
          <div class="chart-container"><h2>PnL Cumulé Post-Grid</h2><canvas id="gridPnlChart"></canvas></div>
        </div>
      </div>

      <!-- CAPITAL CHART -->
      <div class="section">
        <div class="section-title">📈 Évolution du Capital</div>
        <div class="chart-container">
          <h2>Paulo vs Andro vs Total</h2>
          <canvas id="capitalChart"></canvas>
        </div>
      </div>

      <!-- AGENTS -->
      <div class="section">
        <div class="section-title">🤖 Agents</div>
        <div class="agent-grid">
          <div class="agent-card paulo">
            <div class="agent-header">
              <div>
                <div class="agent-name paulo">🧠 Paulo</div>
                <div class="agent-role">Quant · Grid Engine</div>
              </div>
              <span class="badge badge-paulo">ACTIF</span>
            </div>
            <div class="agent-stats">
              <div class="agent-stat"><div class="as-label">Capital</div><div class="as-value">${$(pauloEquity)}</div></div>
              <div class="agent-stat"><div class="as-label">PnL Grid</div><div class="as-value ${colorClass(pauloRealizedPnlGrid)}">${$(pauloRealizedPnlGrid)}</div></div>
              <div class="agent-stat"><div class="as-label">Marge</div><div class="as-value">${pauloMarginPct.toFixed(1)}%</div></div>
              <div class="agent-stat"><div class="as-label">Fills Grid</div><div class="as-value">${Object.values(pauloDailyGrid).reduce((s, d) => s + d.count, 0)}</div></div>
              <div class="agent-stat"><div class="as-label">PnL % All</div><div class="as-value ${colorClass(pauloEquity - PAULO_ALLOC)}">${pct((pauloEquity - PAULO_ALLOC) / PAULO_ALLOC * 100)}</div></div>
              <div class="agent-stat"><div class="as-label">Positions</div><div class="as-value">${pauloPositions.length}</div></div>
            </div>
          </div>
          <div class="agent-card andro">
            <div class="agent-header">
              <div>
                <div class="agent-name andro">⚡ Andro</div>
                <div class="agent-role">Trader Autonome · Test</div>
              </div>
              <span class="badge badge-andro">ACTIF</span>
            </div>
            <div class="agent-stats">
              <div class="agent-stat"><div class="as-label">Capital</div><div class="as-value">${$(androEquity)}</div></div>
              <div class="agent-stat"><div class="as-label">PnL Grid</div><div class="as-value ${colorClass(androRealizedPnlGrid)}">${$(androRealizedPnlGrid)}</div></div>
              <div class="agent-stat"><div class="as-label">Marge</div><div class="as-value">${androMarginPct.toFixed(1)}%</div></div>
              <div class="agent-stat"><div class="as-label">Fills Grid</div><div class="as-value">${Object.values(androDailyGrid).reduce((s, d) => s + d.count, 0)}</div></div>
              <div class="agent-stat"><div class="as-label">PnL % All</div><div class="as-value ${colorClass(androEquity - ANDRO_ALLOC)}">${pct((androEquity - ANDRO_ALLOC) / ANDRO_ALLOC * 100)}</div></div>
              <div class="agent-stat"><div class="as-label">Positions</div><div class="as-value">${androPositions.length}</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- POSITIONS -->
      <div class="section">
        <div class="section-title">📍 Positions Ouvertes</div>
        ${allPositions.length > 0 ? `
        <table class="positions-table">
          <thead><tr><th>Agent</th><th>Coin</th><th>Side</th><th>Size</th><th>Entry</th><th>uPnL</th><th>Lev</th><th>Context</th></tr></thead>
          <tbody>
            ${allPositions.map(p => {
              const szi = parseFloat(p.szi);
              const isLong = szi > 0;
              const upnl = parseFloat(p.unrealizedPnl);
              const lev = p.leverage ? (p.leverage.value + '×') : '—';
              const tagClass = p.agent === 'PAULO' ? 'tag-paulo' : 'tag-andro';
              const isGrid = p.agent === 'PAULO';
              return `<tr>
                <td><span class="agent-tag ${tagClass}">${p.agent}</span></td>
                <td><strong>${p.coin}</strong></td>
                <td class="${isLong ? 'green' : 'red'}">${isLong ? 'LONG' : 'SHORT'}</td>
                <td>${Math.abs(szi).toFixed(4)}</td>
                <td>$${parseFloat(p.entryPx).toFixed(2)}</td>
                <td class="${colorClass(upnl)}">${$(upnl)}</td>
                <td>${lev}</td>
                <td>${isGrid ? '<span class="agent-tag tag-grid">GRID</span>' : ''}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>` : `<div style="color:var(--text-muted);font-family:var(--mono);font-size:0.82rem;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);">Aucune position ouverte</div>`}
      </div>

      <!-- CHARTS -->
      <div class="section">
        <div class="section-title">📊 Performance All-time</div>
        <div class="charts-two">
          <div class="chart-container"><h2>Activité Trading (fills/jour)</h2><canvas id="activityChart"></canvas></div>
          <div class="chart-container"><h2>Répartition du Capital</h2><canvas id="capitalPie"></canvas></div>
        </div>
        <div class="chart-container"><h2>Marge Utilisée</h2><canvas id="marginChart"></canvas></div>
      </div>
    `;

    // === CHARTS ===
    const ttOpts = { backgroundColor: '#1a1b25', borderColor: '#2a2b38', borderWidth: 1, titleFont: { family: "'Inter'" }, bodyFont: { family: "'JetBrains Mono'" } };

    // Grid Fills Chart
    new Chart(document.getElementById('gridFillsChart'), {
      type: 'bar',
      data: {
        labels: gridDateLabels,
        datasets: [
          { label: 'BTC', data: btcFillsPerDay, backgroundColor: 'rgba(245,158,11,0.6)', borderRadius: 6 },
          { label: 'ETH', data: ethFillsPerDay, backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 6 },
          { label: 'SOL', data: solFillsPerDay, backgroundColor: 'rgba(168,85,247,0.6)', borderRadius: 6 }
        ]
      },
      options: { 
        responsive: true,
        plugins: { legend: { labels: { color: tickColor, usePointStyle: true } }, tooltip: ttOpts },
        scales: { 
          x: { stacked: true, ticks: { color: tickColor }, grid: { color: gridColor } },
          y: { stacked: true, ticks: { color: tickColor }, grid: { color: gridColor } }
        }
      }
    });

    // Grid PnL Chart
    new Chart(document.getElementById('gridPnlChart'), {
      type: 'line',
      data: {
        labels: gridDateLabels,
        datasets: [
          { label: 'PnL Cumulé', data: gridCumulativePnl, borderColor: GREEN, backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.3, pointRadius: 4, borderWidth: 2.5 }
        ]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: tickColor } }, tooltip: { ...ttOpts, callbacks: { label: ctx => `PnL: $${ctx.parsed.y}` } } },
        scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, callback: v => '$' + v }, grid: { color: gridColor } } }
      }
    });

    // Capital Chart with Grid Era marker
    const gridStartIndex = dates.findIndex(d => d === GRID_START_DATE.toISOString().slice(0, 10));
    new Chart(document.getElementById('capitalChart'), {
      type: 'line',
      data: {
        labels: dateLabels,
        datasets: [
          { label: 'Total', data: totalCurve, borderColor: GREEN, backgroundColor: 'rgba(16,185,129,0.08)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: GREEN, borderWidth: 2.5 },
          { label: 'Paulo', data: pauloCurve, borderColor: BLUE, backgroundColor: 'rgba(59,130,246,0.05)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: BLUE, borderWidth: 2 },
          { label: 'Andro', data: androCurve, borderColor: PURPLE, backgroundColor: 'rgba(168,85,247,0.05)', fill: true, tension: 0.3, pointRadius: 4, pointBackgroundColor: PURPLE, borderWidth: 2 },
          { label: 'Départ $317.76', data: dateLabels.map(() => TOTAL_DEPOSIT), borderColor: '#374151', borderDash: [6, 4], pointRadius: 0, borderWidth: 1, fill: false }
        ]
      },
      options: {
        responsive: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: tickColor, usePointStyle: true, pointStyle: 'circle', padding: 16, font: { family: "'Inter'", size: 11 } } },
          tooltip: { ...ttOpts, callbacks: { label: ctx => `${ctx.dataset.label}: $${ctx.parsed.y.toFixed(2)}` } },
          annotation: gridStartIndex >= 0 ? {
            annotations: {
              gridEraLine: {
                type: 'line',
                xMin: gridStartIndex,
                xMax: gridStartIndex,
                borderColor: ORANGE,
                borderWidth: 2,
                borderDash: [8, 4],
                label: {
                  display: true,
                  content: 'Grid Era',
                  position: 'start',
                  backgroundColor: 'rgba(245,158,11,0.8)',
                  color: '#0a0b0f',
                  font: { family: "'JetBrains Mono'", size: 10, weight: 'bold' },
                  padding: 4
                }
              }
            }
          } : {}
        },
        scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor, callback: v => '$' + v }, grid: { color: gridColor } } }
      },
      plugins: gridStartIndex >= 0 ? [{
        id: 'gridEraMarker',
        afterDatasetsDraw(chart) {
          const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
          const xPos = x.getPixelForValue(gridStartIndex);
          ctx.save();
          ctx.strokeStyle = ORANGE;
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 4]);
          ctx.beginPath();
          ctx.moveTo(xPos, top);
          ctx.lineTo(xPos, bottom);
          ctx.stroke();
          ctx.restore();
        }
      }] : []
    });

    new Chart(document.getElementById('capitalPie'), {
      type: 'doughnut',
      data: { labels: ['Paulo', 'Andro'], datasets: [{ data: [pauloEquity, androEquity], backgroundColor: [BLUE, PURPLE], borderColor: '#12131a', borderWidth: 3 }] },
      options: { responsive: true, cutout: '60%', plugins: { legend: { labels: { color: tickColor, usePointStyle: true, padding: 16 }, position: 'bottom' }, tooltip: { ...ttOpts, callbacks: { label: ctx => `${ctx.label}: $${ctx.parsed.toFixed(2)} (${((ctx.parsed / totalEquity) * 100).toFixed(0)}%)` } } } }
    });

    new Chart(document.getElementById('activityChart'), {
      type: 'bar',
      data: { labels: dateLabels, datasets: [
        { label: 'Paulo', data: pauloActivity, backgroundColor: 'rgba(59,130,246,0.6)', borderRadius: 6 },
        { label: 'Andro', data: androActivity, backgroundColor: 'rgba(168,85,247,0.6)', borderRadius: 6 }
      ]},
      options: { responsive: true, plugins: { legend: { labels: { color: tickColor, usePointStyle: true, pointStyle: 'circle' } }, tooltip: ttOpts }, scales: { x: { ticks: { color: tickColor }, grid: { color: gridColor } }, y: { ticks: { color: tickColor }, grid: { color: gridColor } } } }
    });

    new Chart(document.getElementById('marginChart'), {
      type: 'bar',
      data: { labels: ['Paulo', 'Andro'], datasets: [
        { label: 'Marge Utilisée', data: [pauloMarginPct, androMarginPct], backgroundColor: ['rgba(59,130,246,0.6)', 'rgba(168,85,247,0.6)'], borderRadius: 8 },
        { label: 'Seuil Danger (75%)', data: [75, 75], backgroundColor: 'rgba(239,68,68,0.15)', borderRadius: 0 }
      ]},
      options: { responsive: true, plugins: { legend: { labels: { color: tickColor } }, tooltip: ttOpts }, scales: { x: { stacked: false, ticks: { color: tickColor }, grid: { color: gridColor } }, y: { max: 100, ticks: { color: tickColor, callback: v => v + '%' }, grid: { color: gridColor } } } }
    });

  } catch (err) {
    document.getElementById('content').innerHTML = `<div class="loading" style="color:var(--red);">❌ Erreur: ${err.message}<br><br><button onclick="loadDashboard()" style="padding:8px 16px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;cursor:pointer;font-family:var(--mono);">Réessayer</button></div>`;
  }
}

loadDashboard();
</script>
</body>
</html>
